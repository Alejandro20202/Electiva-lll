<div class="app-layout">
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/dashboard" aria-label="EduTrack, ir al Dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 6.5c-2.1-1.6-5.3-2-8-1.5v13c2.8-.5 5.9-.1 8 1.5m0-13c2.1-1.6 5.3-2 8-1.5v13c-2.8-.5-5.9-.1-8 1.5m0-13v13"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
          />
        </svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name">EduTrack</span>
        <span class="brand-caption">Tu espacio académico</span>
      </span>
    </a>

    <span class="nav-label">MENÚ PRINCIPAL</span>
    <nav class="primary-nav" aria-label="Secciones de EduTrack">
      <a
        class="nav-link"
        routerLink="/dashboard"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="3.5" width="7" height="4" rx="1.5" />
          <rect x="13.5" y="10.5" width="7" height="10" rx="1.5" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
        </svg>
        <span>Dashboard</span>
      </a>
      <a
        class="nav-link"
        routerLink="/materias"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z" />
          <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8m-8 4h6" />
        </svg>
        <span>Materias</span>
      </a>
      <a
        class="nav-link"
        routerLink="/tareas"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 5H5v16h14V5h-3M9 3h6v4H9V3Z" />
          <path d="m8 13 2 2 5-5m-7 9h8" />
        </svg>
        <span>Tareas</span>
      </a>
      <a
        class="nav-link"
        routerLink="/calendario"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="16" rx="2" />
          <path d="M7.5 3v4m9-4v4m-13 2h17M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01" />
        </svg>
        <span>Calendario</span>
      </a>
      <a
        class="nav-link"
        routerLink="/estadisticas"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 20V10m5 10V4m5 16v-7m5 7V7m-17 14h20" />
        </svg>
        <span>Estadísticas</span>
      </a>
    </nav>

    <p class="sidebar-note">ORGANIZA <span aria-hidden="true">·</span> APRENDE <span aria-hidden="true">·</span> AVANZA</p>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <h1>{{ pageTitle | async }}</h1>
      <div class="student-profile" aria-label="Perfil visual del estudiante">
        <span class="avatar" aria-hidden="true">ES</span>
        <span class="student-label">Estudiante</span>
      </div>
    </header>

    <div class="page-content">
      <router-outlet />
    </div>
  </main>
</div>
